<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Animal Body Parts Zoo</title>
<style>
:root{--bg:#f4f8f2;--card:#fff;--ink:#1d3a2f;--green:#3d6e5a;--soft:#fff6dc;--line:#cfe0d4;--ok:#2e9e5b;--bad:#d64545;--chip:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13211b;--card:#1c2f27;--ink:#eaf4ee;--green:#4f8d74;--soft:#2b2a1a;--line:#35564a;--chip:#243a31}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;padding:12px}
.wrap{max-width:1100px;margin:auto}
.top{display:flex;gap:10px;flex-wrap:wrap}
.top input{flex:1;min-width:110px;border:0;border-bottom:2px solid var(--ink);background:transparent;color:var(--ink);font-size:16px;padding:6px}
h1{text-align:center;color:var(--green);margin:10px 0;font-size:clamp(26px,5vw,42px)}
.bar{background:var(--green);color:#fff;border-radius:14px;padding:10px 16px;font-weight:bold;font-size:18px}
.hint{font-style:italic;margin:8px 4px}
.box{background:var(--soft);border:3px dashed #e5b84a;border-radius:16px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;position:sticky;top:0;z-index:5}
.chip{background:var(--chip);color:var(--ink);border:2px solid var(--ink);border-radius:30px;padding:10px 20px;font-size:22px;font-weight:bold;cursor:pointer;transition:transform .15s;font-family:inherit}
.chip:hover{transform:scale(1.08)}
.chip.sel{background:#ffd54a;color:#222;transform:scale(1.12);animation:pulse .8s infinite}
.chip.used{opacity:.25;pointer-events:none;text-decoration:line-through}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,213,74,.4)}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;margin:16px 0}
.card{background:var(--card);border:3px solid var(--green);border-radius:20px;padding:12px;text-align:center}
.pic{font-size:110px;line-height:1.1;cursor:pointer;display:inline-block;transition:transform .2s;user-select:none}
.pic:hover{transform:scale(1.12) rotate(-4deg)}
.pic.hop{animation:hop .7s}
@keyframes hop{30%{transform:translateY(-30px) scale(1.2)}60%{transform:translateY(0) rotate(8deg)}100%{transform:none}}
.name{font-size:26px;font-weight:bold;color:var(--green)}
.sent{font-size:21px;line-height:2.1;margin-top:4px}
.blank{display:inline-block;min-width:130px;border-bottom:3px solid var(--ink);margin:0 4px;padding:0 8px;font-weight:bold;cursor:pointer;color:var(--ink);border-radius:6px 6px 0 0}
.blank:hover{background:rgba(255,213,74,.35)}
.blank.ok{color:#fff;background:var(--ok);border-color:var(--ok);animation:pop .5s;cursor:default}
.blank.bad{background:var(--bad);color:#fff;animation:shake .45s}
@keyframes pop{50%{transform:scale(1.3)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.score{border:3px solid var(--ink);padding:8px 18px;font-weight:bold;font-size:22px;border-radius:6px}
button.act{background:var(--green);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:18px;font-weight:bold;cursor:pointer;font-family:inherit}
.credit{text-align:center;margin:18px 0;opacity:.8}
#win{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20}
#win div{background:var(--card);border-radius:24px;padding:30px;text-align:center;max-width:90%;animation:pop .6s}
#win h2{font-size:34px;margin:0 0 8px;color:var(--green)}
.fall{position:fixed;top:-50px;font-size:34px;animation:fall 3s linear forwards;z-index:30;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><label>Name: <input id="nm"></label><label>Class: <input id="cl"></label><label>Date: <input id="dt"></label></div>
<h1>🐾 Animal Body Parts Zoo 🐾</h1>
<div class="bar">Part 1: Write the word under the right animal (12 marks)</div>
<p class="hint">Tap a word from the box, then tap the blank. Tap an animal to hear the sentence.</p>
<div class="box" id="box"></div>
<div class="grid" id="grid"></div>
<div class="foot"><div class="score">Part 1: <span id="sc">0</span> / 12</div><button class="act" id="rs">🔄 Try again</button></div>
<div class="credit">Created by T.Badria Alfalahi</div>
</div>
<div id="win"><div><div style="font-size:90px">🏆</div><h2>Excellent work!</h2><p style="font-size:22px">You scored <b id="fs">12</b> / 12</p><button class="act" id="cl2">Close</button></div></div>
<script>
const D=[["🦅","eagle","An eagle has sharp","on its feet.","claws"],["🐱","cat","A cat has long","on its face.","whiskers"],["🪿","goose","A goose has an orange",".","beak"],["🐟","fish","A fish has","on its skin.","scales"],["🦔","porcupine","A porcupine has","on its back.","spines"],["🦗","grasshopper","A grasshopper has two","on its head.","antennae"],["🐶","dog","A dog has four",".","paws"],["🦭","seal","A seal has two","to swim.","flippers"],["🐪","camel","A camel has a","on its back.","hump"],["🦎","chameleon","A chameleon has a long","to catch insects.","tongue"],["🐐","goat","A goat has two","on its head.","horns"],["🦈","shark","A shark has a big","on its back.","fin"]];
const words=["whiskers","flippers","horns","claws","paws","fin","spines","antennae","beak","hump","tongue","scales"];
let sel=null,score=0,ac;
function snd(f,d,t,v){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t||"sine";o.frequency.value=f;g.gain.value=v||.15;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
function good(){snd(523,.15);setTimeout(()=>snd(659,.15),120);setTimeout(()=>snd(784,.3),240)}
function bad(){snd(180,.35,"sawtooth",.12)}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function rain(list){list.forEach((e,i)=>setTimeout(()=>{const s=document.createElement("div");s.className="fall";s.textContent=e;s.style.left=Math.random()*95+"vw";document.body.appendChild(s);setTimeout(()=>s.remove(),3100)},i*90))}
function build(){
 score=0;sel=null;sc.textContent=0;win.style.display="none";
 const box=document.getElementById("box");box.innerHTML="";
 [...words].sort(()=>Math.random()-.5).forEach(w=>{const b=document.createElement("button");b.className="chip";b.textContent=w;b.dataset.w=w;b.onclick=()=>{document.querySelectorAll(".chip").forEach(c=>c.classList.remove("sel"));sel=w;b.classList.add("sel");snd(440,.1);say(w)};box.appendChild(b)});
 const g=document.getElementById("grid");g.innerHTML="";
 D.forEach(a=>{const c=document.createElement("div");c.className="card";
  c.innerHTML=`<div class="pic">${a[0]}</div><div class="name">${a[1]}</div><div class="sent">${a[2]} <span class="blank">&nbsp;</span> ${a[3]}</div>`;
  const pic=c.querySelector(".pic"),bl=c.querySelector(".blank");
  pic.onclick=()=>{pic.classList.remove("hop");void pic.offsetWidth;pic.classList.add("hop");say(a[2]+" "+(bl.classList.contains("ok")?a[4]:"blank")+" "+a[3])};
  bl.onclick=()=>{
   if(bl.classList.contains("ok"))return;
   if(!sel){bl.classList.add("bad");setTimeout(()=>bl.classList.remove("bad"),450);bad();return}
   if(sel===a[4]){bl.textContent=sel;bl.classList.add("ok");document.querySelector(`.chip[data-w="${sel}"]`).classList.add("used");sel=null;score++;sc.textContent=score;good();pic.classList.add("hop");say(a[2]+" "+a[4]+" "+a[3]);rain(["⭐"]);
    if(score==12)setTimeout(()=>{fs.textContent=score;win.style.display="flex";rain(["🎉","⭐","🎈","✨","🏆","🐾","🎊","🌟","🎉","⭐","🎈","✨","🎊","🌟","🏆","🐾"]);good()},900)}
   else{bl.textContent=sel;bl.classList.add("bad");bad();const w=sel;setTimeout(()=>{bl.classList.remove("bad");bl.innerHTML="&nbsp;"},700)}
  };
  g.appendChild(c)});
}
document.getElementById("rs").onclick=build;
document.getElementById("cl2").onclick=()=>win.style.display="none";
build();
</script>
</body>
</html>
